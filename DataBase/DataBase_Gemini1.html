<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Database Learning Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <!-- Chosen Palette: Calm Focus (Grays, Muted Teal/Cyan) -->
    <!-- Application Structure Plan: A non-linear, SPA dashboard design. A persistent sidebar navigation allows users to jump to any topic instantly. The main content area dynamically displays the selected topic, preventing overwhelming the user with a single long page. This structure prioritizes user-directed exploration over the linear format of the source report. Key interactions include interactive charts for comparisons (e.g., ACID vs. BASE), dynamic diagrams for concepts (e.g., joins, normalization), and utility features like search and code-copying to enhance usability and learning retention. This modular, on-demand content display is more effective for both targeted learning and comprehensive study. -->
    <!-- Visualization & Content Choices: The application uses a variety of interactive elements tailored to the learning objective of each section. Goal: Compare -> Use Chart.js bar/doughnut charts (e.g., RDBMS vs NoSQL, Isolation Levels). Goal: Explain complex structures -> Use interactive HTML/CSS diagrams (e.g., Joins, ERDs, Normal Forms) that respond to user clicks, which is more engaging than static images. Goal: Practical Application -> Provide formatted SQL code blocks with a one-click copy feature. Goal: Organize -> Use tabbed interfaces to neatly segment dense topics like SQL command types (DDL, DML). This approach makes the material more digestible and interactive, supporting the overall goal of efficient learning. -->
    <!-- CONFIRMATION: NO SVG graphics used. NO Mermaid JS used. -->

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        .chart-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            height: 300px;
            max-height: 400px;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 350px;
            }
        }
        .sidebar-link {
            transition: all 0.2s ease-in-out;
        }
        .sidebar-link.active {
            background-color: #0d9488; /* teal-600 */
            color: white;
            transform: translateX(4px);
        }
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .interactive-diagram-item {
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        .interactive-diagram-item:hover, .interactive-diagram-item.selected {
            transform: scale(1.05);
            box-shadow: 0 4px 14px 0 rgba(0, 150, 136, 0.38);
            border-color: #0d9488;
        }
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    <div class="flex min-h-screen">

        <aside id="sidebar" class="w-64 bg-gray-800 text-white p-4 space-y-2 fixed h-full overflow-y-auto">
            <h1 class="text-2xl font-bold text-teal-400 mb-4">Database Hub</h1>
            <input type="text" id="searchInput" placeholder="Search topics..." class="w-full p-2 rounded bg-gray-700 text-white border border-gray-600 focus:outline-none focus:ring-2 focus:ring-teal-500">
            <nav id="sidebarNav" class="mt-4 space-y-1"></nav>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 p-4 md:p-8 w-full">
            <div id="content-container">
                <!-- Content will be injected here -->
            </div>
        </main>
    </div>
    
    <script>
        // Helper function for creating code blocks
        function createCodeBlock(code, description) {
            const id = `code-${Math.random().toString(36).substr(2, 9)}`;
            return `
                <div class="bg-gray-800 rounded-lg shadow-md">
                    <div class="p-4">
                        <p class="text-sm text-gray-300 mb-2">${description}</p>
                        <div class="bg-gray-900 p-4 rounded relative">
                            <pre><code id="${id}" class="text-white font-mono text-sm">${escapeHtml(code)}</code></pre>
                            <button onclick="copyCode('${id}')" class="absolute top-2 right-2 bg-teal-500 text-white px-2 py-1 rounded text-xs hover:bg-teal-600">Copy</button>
                        </div>
                    </div>
                </div>`;
        }

        // Global function for copying code
        window.copyCode = function(elementId) {
            const codeElement = document.getElementById(elementId);
            const textToCopy = codeElement.innerText;
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = textToCopy;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);
            alert('Code copied to clipboard!');
        }
        
        // Helper function to escape HTML for code blocks
        function escapeHtml(unsafe) {
            return unsafe
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
        }

        const contentData = {
            "db-fundamentals": {

                                        <tr><td class="p-4">Relationships</td><td class="p-4">Limited to simple links</td><td class="p-4">Manages complex relationships</td></tr>

        const joinExplanations = {
            inner: { title: 'INNER JOIN', desc: 'Returns records that have matching values in both tables. This is the most common type of join.' },

        const capExplanations = {

        document.addEventListener('DOMContentLoaded', () => {
            const sidebarNav = document.getElementById('sidebarNav');
            const contentContainer = document.getElementById('content-container');
            const searchInput = document.getElementById('searchInput');

            const sections = Object.keys(contentData);

            function populateSidebar(filter = '') {
                sidebarNav.innerHTML = '';
                sections.forEach(id => {
                    const section = contentData[id];
                    if (section.title.toLowerCase().includes(filter.toLowerCase())) {
                        const link = document.createElement('a');
                        link.href = `#${id}`;
                        link.textContent = section.title;
                        link.className = 'sidebar-link block p-2 rounded hover:bg-gray-700';
                        link.dataset.sectionId = id;
                        sidebarNav.appendChild(link);
                    }
                });
            }

            function showSection(sectionId) {
                const sectionData = contentData[sectionId];
                if (!sectionData) return;

                document.querySelectorAll('.sidebar-link').forEach(l => {
                    l.classList.toggle('active', l.dataset.sectionId === sectionId);
                });

                contentContainer.innerHTML = `
                    <section id="${sectionId}" class="content-section active">
                        <h2 class="text-4xl font-bold mb-4 text-gray-800">${sectionData.title}</h2>
                        <p class="text-xl text-gray-600 mb-8 leading-relaxed">${sectionData.intro}</p>
                        ${sectionData.content}
                    </section>
                `;
                
                window.scrollTo(0, 0);
                
                if(sectionId === 'db-fundamentals') initDbTypesChart();
                if(sectionId === 'sql-basics') initSqlTabs();
                if(sectionId === 'sql-joins') initJoinVisualizer();
                if(sectionId === 'db-design') initNormVisualizer();
                if(sectionId === 'nosql-db') { initNoSqlChart(); initCapTheorem(); }

            sidebarNav.addEventListener('click', e => {
                e.preventDefault();
                if (e.target.tagName === 'A') {
                    const sectionId = e.target.dataset.sectionId;
                    showSection(sectionId);

            });

            searchInput.addEventListener('input', (e) => {
                populateSidebar(e.target.value);
            });

            function initDbTypesChart() {
                const ctx = document.getElementById('dbTypesChart').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['Relational (SQL)', 'Non-Relational (NoSQL)', 'Specialized'],
                        datasets: [{
                            label: 'Database Types',
                            data: [45, 35, 20],
                            backgroundColor: ['#2dd4bf', '#60a5fa', '#f87171'],
                            borderColor: '#ffffff',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'top' },
                            tooltip: { callbacks: { label: (c) => `${c.label}: ${c.raw}%` } }
                        }
                    }
                });
            }
            
            function initSqlTabs() {
                const tabButtons = document.querySelectorAll('.sql-tab-btn');
                const tabContents = document.querySelectorAll('.sql-tab-content');
                tabButtons.forEach(button => {
                    button.addEventListener('click', () => {
                        tabButtons.forEach(btn => {
                            btn.classList.remove('border-teal-500');
                            btn.classList.add('text-gray-500');
                        });
                        button.classList.add('border-teal-500');
                        button.classList.remove('text-gray-500');
                        
                        tabContents.forEach(content => {
                            content.classList.add('hidden');
                        });
                        document.getElementById(button.dataset.target).classList.remove('hidden');
                    });
                });
            }

            function initJoinVisualizer() {
                const buttons = document.querySelectorAll('.join-btn');
                const leftCircle = document.getElementById('join-circle-left');
                const rightCircle = document.getElementById('join-circle-right');
                const explanationDiv = document.getElementById('join-explanation');

                buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        const joinType = button.dataset.join;
                        
                        buttons.forEach(b => b.classList.remove('bg-teal-500', 'text-white'));
                        button.classList.add('bg-teal-500', 'text-white');

                        leftCircle.className = 'w-40 h-40 rounded-full flex items-center justify-center font-bold text-xl transition-all duration-300';
                        rightCircle.className = 'w-40 h-40 rounded-full flex items-center justify-center font-bold text-xl transition-all duration-300';
                        
                        if (joinType === 'inner') {
                            leftCircle.classList.add('bg-blue-300', 'opacity-70', 'text-blue-800');
                            rightCircle.classList.add('bg-pink-300', 'opacity-70', 'text-pink-800', 'bg-blend-multiply');
                            rightCircle.style.backgroundBlendMode = 'multiply';
                        } else if (joinType === 'left') {
                            leftCircle.classList.add('bg-blue-500', 'opacity-100', 'text-white');
                            rightCircle.classList.add('bg-pink-300', 'opacity-70', 'text-pink-800', 'bg-blend-multiply');
                            rightCircle.style.backgroundBlendMode = 'multiply';
                        } else if (joinType === 'right') {
                            leftCircle.classList.add('bg-blue-300', 'opacity-70', 'text-blue-800', 'bg-blend-multiply');
                            rightCircle.classList.add('bg-pink-500', 'opacity-100', 'text-white');
                             rightCircle.style.backgroundBlendMode = 'normal';
                             leftCircle.style.backgroundBlendMode = 'multiply';
                        } else if (joinType === 'full') {
                            leftCircle.classList.add('bg-blue-500', 'opacity-100', 'text-white');
                            rightCircle.classList.add('bg-pink-500', 'opacity-100', 'text-white');
                             rightCircle.style.backgroundBlendMode = 'normal';
                             leftCircle.style.backgroundBlendMode = 'normal';
                        }
                        
                        const explanation = joinExplanations[joinType];
                        explanationDiv.innerHTML = `<h4 class="text-xl font-semibold mb-2">${explanation.title}</h4><p>${explanation.desc}</p>`;
                    });
                });
            }

            function initNormVisualizer() {
                const container = document.getElementById('norm-container');
                container.innerHTML = normSteps.map((step, index) => `
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <h4 class="text-xl font-semibold mb-2 text-teal-700">${index + 1}. ${step.level}</h4>
                        <p class="mb-4">${step.desc}</p>
                        <div class="overflow-x-auto">${step.table}</div>
                    </div>
                `).join('');
            }

            function initNoSqlChart() {
                const ctx = document.getElementById('noSqlChart').getContext('2d');
                new Chart(ctx, {
                    type: 'radar',
                    data: {
                        labels: ['Schema Flexibility', 'Scalability', 'Query Complexity', 'Data Structure', 'Performance'],
                        datasets: [
                            {
                                label: 'Document',
                                data: [9, 8, 7, 8, 8],
                                fill: true,
                                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                                borderColor: 'rgb(54, 162, 235)',
                                pointBackgroundColor: 'rgb(54, 162, 235)',
                            }, {
                                label: 'Key-Value',
                                data: [5, 10, 3, 4, 10],
                                fill: true,
                                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                                borderColor: 'rgb(255, 99, 132)',
                                pointBackgroundColor: 'rgb(255, 99, 132)',
                            }, {
                                label: 'Graph',
                                data: [8, 7, 9, 10, 6],
                                fill: true,
                                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                                borderColor: 'rgb(75, 192, 192)',
                                pointBackgroundColor: 'rgb(75, 192, 192)',
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        elements: { line: { tension: 0.1 } },
                        scales: { r: { angleLines: { display: false }, suggestedMin: 0, suggestedMax: 10 } }
                    }
                });
            }
            
            function initCapTheorem() {
                const buttons = document.querySelectorAll('.cap-btn');
                const explanationDiv = document.getElementById('cap-explanation');

                buttons.forEach(button => {
                    button.addEventListener('click', () => {
                        const capType = button.dataset.cap;
                        buttons.forEach(b => b.classList.remove('ring-4', 'ring-offset-2', 'ring-teal-400'));
                        button.classList.add('ring-4', 'ring-offset-2', 'ring-teal-400');
                        
                        const explanation = capExplanations[capType];
                        explanationDiv.innerHTML = `<h4 class="text-xl font-semibold mb-2">${explanation.title}</h4><p>${explanation.desc}</p>`;
                    });
                });
            }

            // Initial setup
            populateSidebar();
            if (sections.length > 0) {
                showSection(sections[0]);
            }
        });
    </script>

</body>
</html>
